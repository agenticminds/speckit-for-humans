name: CI

# All third-party actions are pinned to commit SHAs (not tags) to defend
# against tag-hijack supply-chain attacks. When bumping versions, resolve
# the new SHA via:
#   gh api repos/<owner>/<repo>/git/refs/tags/<tag> --jq .object.sha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger, so CI can be exercised on any branch without opening a pull
  # request. Fire it with:
  #   gh workflow run ci.yml --repo <owner>/<repo> --ref <branch>
  # GitHub only exposes this trigger once the workflow file exists on the
  # default branch, so it must reach main before it becomes usable.
  workflow_dispatch:

# Default to no permissions; each job opts in to exactly what it needs.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        # actions/setup-node@v4
        # Node is still required: the build scripts are invoked as `node scripts/*.js`.
        # No dependency cache here - Bun owns installation and caches via bun.lock.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}

      - name: Use Bun
        # oven-sh/setup-bun@v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: bun run test:coverage

      - name: Upload coverage reports
        # codecov/codecov-action@v3
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457
        if: matrix.node-version == '24.x'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build extension (release)
        run: bun run build:release

  # Ensure the extension can be packaged
  package:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package extension
        run: bun run package:release

      - name: Upload VSIX artifact
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vsix-package
          path: '*.vsix'
          retention-days: 7
